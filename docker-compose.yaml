services:
  neko:
    image: "ghcr.io/m1k1o/neko/chromium:latest"
    restart: "unless-stopped"
    shm_size: "2gb"
    ports:
      - "8080:8080"
      - "52000:52000/udp"
      - "52000:52000/tcp"
    volumes:
      # Persist Neko application data, including chat history and uploaded avatars.
      - "neko-data:/home/neko/.local/share/neko"
      # Persist Chromium settings, bookmarks, extensions and history across
      # container restarts by mounting the profile directory.
      # - "./profile:/home/neko/.config/chromium"

      # Or mount your own pre-configured Chromium profile instead of an empty one.
      # - "./my-custom-profile:/home/neko/.config/chromium"
    environment:
      # Use one MUX port for WebRTC UDP plus TCP fallback.
      NEKO_WEBRTC_UDPMUX: 52000
      NEKO_WEBRTC_TCPMUX: 52000
      # Specify the screen resolution and refresh rate for the virtual desktop. The
      # default is 1920x1080@30, but you can change it to any other resolution.
      NEKO_DESKTOP_SCREEN: 1920x1080@30
      # You can configure a password for the default user and admin accounts. The
      # default user account is "neko" and the default admin account is "admin".
      NEKO_MEMBER_MULTIUSER_USER_PASSWORD: neko
      NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD: admin
      # Specifying reachable IP by clients is required when running Neko.
      NEKO_WEBRTC_NAT1TO1: <your-IP>

volumes:
  neko-data:
